# Supabase Keep-Alive GitHub Actions Workflow
# This workflow pings your Supabase project every 6 hours to prevent deep sleep

name: Supabase Keep-Alive

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on push to main (optional - comment out if not needed)
  # push:
  #   branches: [ main ]

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Ping Supabase
        run: node scripts/ping-supabase.js
      
      - name: Log result
        if: always()
        run: |
          echo "========================================="
          echo "Supabase Keep-Alive Ping Completed"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "Status: ${{ job.status }}"
          echo "========================================="